# Klyron CRM — Nginx site (example). Copy to /etc/nginx/sites-available/klyron-crm
# and adjust server_name, certificate paths and the uploads folder.
#
# Matching .env on the VPS:
#   APP_URL="https://crm.klyronstudio.com"
#   UPLOAD_DIR="/data/klyron/uploads"
#   NGINX_ACCEL_REDIRECT="1"

server {
    listen 80;
    server_name crm.klyronstudio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.klyronstudio.com;

    ssl_certificate     /etc/letsencrypt/live/crm.klyronstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.klyronstudio.com/privkey.pem;

    # Uploads stream straight through to the app (it enforces MAX_UPLOAD_MB).
    client_max_body_size 600m;
    proxy_request_buffering off;

    # Real client IP for rate limiting and the audit log. Overwrite, never append.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Live updates (Server-Sent Events): no buffering, long-lived connection.
    location = /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # File downloads: the app checks permissions, then hands the bytes to Nginx
    # (X-Accel-Redirect), which serves them fast with Range support for video.
    location /protected-files/ {
        internal;
        alias /data/klyron/uploads/;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "private, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─── LiveKit (video calls) ───────────────────────────────────────────────────
# Signalling goes through Nginx (WebSocket over TLS); media flows directly over
# UDP 50000-60000 / TCP 7881, so open those in the firewall too.
server {
    listen 443 ssl http2;
    server_name livekit.klyronstudio.com;

    ssl_certificate     /etc/letsencrypt/live/livekit.klyronstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.klyronstudio.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
